---
layout: default
---
<article>
  <h1>{{ page.title }}</h1>
  <p class="sous-titre">{{ page.date | date: "%m/%Y" }} · {{ page.cadre }}</p>

  <p class="comp-liste">Compétences :
  {% for c in page.competences %}{% assign comp = site.data.competences | where: "code", c | first %}<span class="comp">{{ comp.libelle }}</span>{% endfor %}
  </p>

  {{ content }}

  <p><a href="{{ '/' | relative_url }}#projets-ecole">Retour aux projets</a></p>
</article>
<script>
document.addEventListener("DOMContentLoaded", function () {
  document.querySelectorAll("article > h2").forEach(function (heading) {
    const title = heading.textContent.trim();
    if (title !== "Description de l'activité" && title !== "Productions et preuves") return;

    const details = document.createElement("details");
    details.className = "section-repliable projet-section";

    const summary = document.createElement("summary");
    summary.textContent = title;
    details.appendChild(summary);

    const content = document.createElement("div");
    content.className = "section-contenu";

    let node = heading.nextElementSibling;
    while (node && node.tagName !== "H2") {
      const next = node.nextElementSibling;
      content.appendChild(node);
      node = next;
    }

    details.appendChild(content);
    heading.replaceWith(details);
  });
});
</script>
